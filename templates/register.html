<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/styles.css">
    <title>LimGen | Регистрация</title>
</head>

<body>
    <header class="header">
        <button class="logo" onclick="window.location.href='../main'" aria-label="На главную">
            <img src="../static/logo.png" alt="Логотип">
        </button>
    </header>

    <main class="main">
        <div class="auth-container">
            <h2 class="auth-title">Регистрация в системе</h2>

            <form class="auth-form" id="registerForm" method="post">
                <div class="form-group">
                    <label for="login" class="form-label">Придумайте логин</label>
                    <input name="login" type="text" id="login" class="form-input" placeholder="Введите логин" required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Придумайте пароль</label>
                    <input name="password" type="password" id="password" class="form-input" placeholder="Введите пароль" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Подтвердите пароль</label>
                    <input name="password_conf" type="password" id="password_conf" class="form-input" placeholder="Повторите пароль"
                        required>
                </div>

                <button type="submit" class="auth-btn">Зарегистрироваться</button>

                {% if error %}
                <div class="error-message" style="display: block;">
                    {{ error }}
                </div>
                {% endif %}

            </form>

            <div class="auth-links">
                <a href="/login" class="register-link">Авторизоваться</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>© 2025 LimGen. Все права защищены.</p>
        <p>Разработано студентами <strong>РТУ МИРЭА</strong> | <a href="#">GitHub проекта</a></p>
        <p><a href="https://t.me/AboutMathematics">О математике. ВУЗ😉</a> | Telegram канал</p>
    </footer>
</body>

</html>
