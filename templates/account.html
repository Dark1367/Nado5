<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/styles.css">
    <title>LimGen | Профиль</title>
</head>

<body>

    <header class="header">
        <button class="logo" onclick="window.location.href='../main'" aria-label="На главную">
            <img src="../static/logo.png" alt="Логотип">
        </button>
        <div class="nav-menu">
            <a href="../account">Профиль</a>  
        </div>
    </header>

    <main class="main">
        <div class="profile-content">
            <div class="greeting-card">
                <span class="greeting-emoji">👨‍🎓</span>
                <span class="greeting-text">Добрый день, {{ user.email }}!</span>
            </div>

            <div class="toggle-switch">
                <span class="toggle-option active" data-mode="generation">Генерации</span>
                <span class="toggle-option" data-mode="templates">Шаблоны</span>
            </div>

            <div class="cards-grid" id="cards-container">
                <div class="card generation-card">
                    <div class="card-title">Генерация 1</div>
                    <div class="card-actions">
                        <button class="card-btn">Посмотреть</button>
                        <button class="card-btn delete-btn">Удалить</button>
                    </div>
                </div>
                <div class="card generation-card">
                    <div class="card-title">Генерация 2</div>
                    <div class="card-actions">
                        <button class="card-btn">Посмотреть</button>
                        <button class="card-btn delete-btn">Удалить</button>
                    </div>
                </div>
                <div class="card generation-card">
                    <div class="card-title">Генерация 3</div>
                    <div class="card-actions">
                        <button class="card-btn">Посмотреть</button>
                        <button class="card-btn delete-btn">Удалить</button>
                    </div>
                </div>
                <div class="card generation-card">
                    <div class="card-title">Генерация 4</div>
                    <div class="card-actions">
                        <button class="card-btn">Посмотреть</button>
                        <button class="card-btn delete-btn">Удалить</button>
                    </div>
                </div>
                <div class="card generation-card">
                    <div class="card-title">Генерация 5</div>
                    <div class="card-actions">
                        <button class="card-btn">Посмотреть</button>
                        <button class="card-btn delete-btn">Удалить</button>
                    </div>
                </div>

                <div class="card template-card hidden">
                    <div class="card-title">Шаблон 1</div>
                    <div class="card-actions">
                        <button class="card-btn delete-btn">Удалить</button>
                        <button class="card-btn generate-btn">Генерировать</button>
                    </div>
                </div>
                <div class="card template-card hidden">
                    <div class="card-title">Шаблон 2</div>
                    <div class="card-actions">
                        <button class="card-btn delete-btn">Удалить</button>
                        <button class="card-btn generate-btn">Генерировать</button>
                    </div>
                </div>
                <div class="card template-card hidden">
                    <div class="card-title">Шаблон 3</div>
                    <div class="card-actions">
                        <button class="card-btn delete-btn">Удалить</button>
                        <button class="card-btn generate-btn">Генерировать</button>
                    </div>
                </div>
                <div class="card template-card hidden">
                    <div class="card-title">Шаблон 4</div>
                    <div class="card-actions">
                        <button class="card-btn delete-btn">Удалить</button>
                        <button class="card-btn generate-btn">Генерировать</button>
                    </div>
                </div>
                <div class="card template-card hidden">
                    <div class="card-title">Шаблон 5</div>
                    <div class="card-actions">
                        <button class="card-btn delete-btn">Удалить</button>
                        <button class="card-btn generate-btn">Генерировать</button>
                    </div>
                </div>
            </div>

            <div class="add-template-container hidden" id="add-template-btn">
                <button class="add-template-btn">+ Добавить шаблон</button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>© 2025 LimGen. Все права защищены.</p>
        <p>Разработано студентами <strong>РТУ МИРЭА</strong> | <a href="#">GitHub проекта</a></p>
        <p><a href="https://t.me/AboutMathematics">О математике. ВУЗ😉</a> | Telegram канал</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const showButtons = document.querySelectorAll('.card-btn:not(.delete-btn):not(.generate-btn)')
            showButtons.forEach((showButton, index) => {
                showButton.addEventListener('click', async function () {
                    const data = {
                        btn: "show",
                        index: index
                    };
                    const response = await fetch('/account', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data),
                        redirect: 'follow' // автоматически следовать за редиректом
                    });
                    if (response.redirected) {
                        window.location.href = response.url; // принудительно переходим
                    } else {
                        const result = await response.json();
                        console.log(result);
                    }
                });
            });

            const genButtons = document.querySelectorAll('.generate-btn')
            genButtons.forEach((genButton, index) => {
                genButton.addEventListener('click', async function () {
                    const data = {
                        btn: "gen",
                        index: index
                    };
                    const response = await fetch('/account', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data),
                        redirect: 'follow' // автоматически следовать за редиректом
                    });
                    if (response.redirected) {
                        window.location.href = response.url; // принудительно переходим
                    } else {
                        const result = await response.json();
                        console.log(result);
                    }
                });
            });

            const dellButtons = document.querySelectorAll('.delete-btn')
            dellButtons.forEach((dellButton, index) => {
                dellButton.addEventListener('click', async function () {
                    const data = {
                        btn: "dell",
                        index: index
                    };
                    const response = await fetch('/account', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data),
                        redirect: 'follow' // автоматически следовать за редиректом
                    });
                    if (response.redirected) {
                        window.location.href = response.url; // принудительно переходим
                    } else {
                        const result = await response.json();
                        console.log(result);
                    }
                });
            });
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const toggleOptions = document.querySelectorAll('.toggle-option');
            const generationCards = document.querySelectorAll('.generation-card');
            const templateCards = document.querySelectorAll('.template-card');
            const addTemplateBtn = document.getElementById('add-template-btn');

            toggleOptions.forEach(option => {
                option.addEventListener('click', function () {
                    toggleOptions.forEach(opt => opt.classList.remove('active'));
                    this.classList.add('active');

                    const mode = this.getAttribute('data-mode');

                    if (mode === 'generation') {
                        generationCards.forEach(card => card.classList.remove('hidden'));
                        templateCards.forEach(card => card.classList.add('hidden'));
                        addTemplateBtn.classList.add('hidden');
                    } else {
                        generationCards.forEach(card => card.classList.add('hidden'));
                        templateCards.forEach(card => card.classList.remove('hidden'));
                        addTemplateBtn.classList.remove('hidden');
                    }
                });
            });
        });
    </script>
</body>

<script>
    async function updateGenerations() {
        const response = await fetch('/get_user_info');
        const data = await response.json();

        const dates = data["gen"];
        const generations_cards = document.querySelectorAll('.generation-card');
        for (let i = 0; i < 5; i++) {
            generations_cards[i].querySelectorAll('.card-title')[0].textContent = dates[i]
            if (dates[i] === "") {
                generations_cards[i].querySelectorAll('.card-btn').forEach(but => {
                    but.remove();
                });
            }
        }

        const titles = data["temp"];
        const templates_cards = document.querySelectorAll('.template-card');
        for (let i = 0; i < 5; i++) {
            templates_cards[i].querySelectorAll('.card-title')[0].textContent = titles[i]
            if (titles[i] === "") {
                templates_cards[i].querySelectorAll('.card-btn').forEach(but => {
                    but.remove();
                });
            }
        }
    }

    document.addEventListener('DOMContentLoaded', updateGenerations);
</script>

</html>
