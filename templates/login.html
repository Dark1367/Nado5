<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../static/styles.css">
  <title>LimGen | Авторизация</title>
</head>

<body>
  <header class="header">
    <button class="logo" onclick="window.location.href='../main'" aria-label="На главную">
      <img src="../static/logo.png" alt="Логотип">
    </button>
  </header>

  <main class="main">
    <div class="auth-container">
      <h2 class="auth-title">Вход в систему</h2>

      <form class="auth-form" id="loginForm" method="post">
        <div class="form-group">
          <label for="login" class="form-label">Логин</label>
          <input name = "login" type="text" id="login" class="form-input" placeholder="Введите логин" required>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Пароль</label>
          <input name = "password" type="password" id="password" class="form-input" placeholder="Введите пароль" required>
        </div>

        <button type="submit" class="auth-btn">Авторизоваться</button>

          {% if error %}
          <div class="error-message" style="display: block;">
              {{ error }}
          </div>
          {% endif %}

      </form>

      <div class="auth-links">
        <a href="../register" class="register-link">Зарегистрироваться</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>© 2025 LimGen. Все права защищены.</p>
    <p>Разработано студентами <strong>РТУ МИРЭА</strong> | <a href="#">GitHub проекта</a></p>
  </footer>
</body>

</html>
